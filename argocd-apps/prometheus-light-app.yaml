apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-light
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/amolwank/fastapi-gitops.git'
    targetRevision: HEAD
    path: monitoring-light
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: fastapi-namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true